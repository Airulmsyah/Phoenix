<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GameWorld — Welcome</title>
  <style>
    :root{--accent:#0f3460;--accent-hover:#533483}
    *{box-sizing:border-box}
    body{
      margin:0;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:Inter, system-ui, Arial, sans-serif;
      background:linear-gradient(135deg,#f6f9fc,#eef2f7);
    }
    .card{
      width:360px;
      background:rgba(255,255,255,0.9);
      border-radius:14px;
      padding:28px;
      box-shadow:0 8px 30px rgba(0,0,0,0.08);
      text-align:center;
    }
    h2{margin:0 0 12px;font-size:20px;color:#222}
    .row{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
    input{
      width:100%;
      padding:10px 12px;border-radius:8px;border:1px solid #ddd;margin:8px 0;
    }
    button{
      background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer;
    }
    button.secondary{background:#fff;color:var(--accent);border:1px solid #ddd}
    .link{background:none;border:none;color:var(--accent);cursor:pointer}
    .small{font-size:13px;color:#666;margin-top:8px}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="card">
    <h2>Welcome to GameWorld</h2>

    <div id="menu">
      <div class="row">
        <button onclick="showForm('login')">Log In</button>
        <button onclick="showForm('signin')">Sign In</button>
        <button onclick="showForm('create')">Create Account</button>
      </div>
      <div class="small">Have an account? Log in. New here? Create one.</div>
    </div>

    <!-- Login -->
    <div id="login" class="hidden">
      <h3 style="margin-top:8px">Log In</h3>
      <input id="loginUser" placeholder="Username" />
      <input id="loginPass" placeholder="Password" type="password" />
      <div style="display:flex;gap:8px;justify-content:center;margin-top:8px">
        <button onclick="login()">Log In</button>
        <button class="secondary" onclick="backToMenu()">Back</button>
      </div>
    </div>

    <!-- Sign In (same as login entry) -->
    <div id="signin" class="hidden">
      <h3 style="margin-top:8px">Sign In</h3>
      <input id="signinUser" placeholder="Username" />
      <input id="signinPass" placeholder="Password" type="password" />
      <div style="display:flex;gap:8px;justify-content:center;margin-top:8px">
        <button onclick="signin()">Sign In</button>
        <button class="secondary" onclick="backToMenu()">Back</button>
      </div>
    </div>

    <!-- Create account -->
    <div id="create" class="hidden">
      <h3 style="margin-top:8px">Create Account</h3>
      <input id="createUser" placeholder="Username" />
      <input id="createPass" placeholder="Password" type="password" />
      <input id="createEmail" placeholder="Email" type="email" />
      <input id="createAge" placeholder="Age" type="number" />
      <div style="display:flex;gap:8px;justify-content:center;margin-top:8px">
        <button onclick="createAccount()">Create</button>
        <button class="secondary" onclick="backToMenu()">Back</button>
      </div>
    </div>
  </div>

  <script>
    // if already logged in -> go home
    if (localStorage.getItem('loggedInUser')) {
      window.location.href = 'home.html';
    }

    function showForm(name){
      document.getElementById('menu').classList.add('hidden');
      document.getElementById(name).classList.remove('hidden');
    }
    function backToMenu(){
      ['login','signin','create'].forEach(id=>document.getElementById(id).classList.add('hidden'));
      document.getElementById('menu').classList.remove('hidden');
    }

    function loadAccounts(){ return JSON.parse(localStorage.getItem('accounts')||'[]'); }
    function saveAccounts(a){ localStorage.setItem('accounts', JSON.stringify(a)); }

    function login(){
      const u=document.getElementById('loginUser').value.trim();
      const p=document.getElementById('loginPass').value;
      const accounts = loadAccounts();
      const found = accounts.find(a=>a.username===u && a.password===p);
      if(found){
        localStorage.setItem('loggedInUser', found.username);
        alert('Logged in!');
        location.href='home.html';
      } else alert('Incorrect username or password.');
    }

    function signin(){ // same as login
      const u=document.getElementById('signinUser').value.trim();
      const p=document.getElementById('signinPass').value;
      const accounts = loadAccounts();
      const found = accounts.find(a=>a.username===u && a.password===p);
      if(found){
        localStorage.setItem('loggedInUser', found.username);
        alert('Signed in!');
        location.href='home.html';
      } else alert('Account not found.');
    }

    function createAccount(){
      const u=document.getElementById('createUser').value.trim();
      const p=document.getElementById('createPass').value;
      const e=document.getElementById('createEmail').value.trim();
      const age=document.getElementById('createAge').value.trim();
      if(!u||!p||!e||!age) return alert('Please fill all fields.');
      const accounts = loadAccounts();
      if(accounts.some(a=>a.username===u)) return alert('Username exists.');
      accounts.push({username:u,password:p,email:e,age:age});
      saveAccounts(accounts);
      alert('Account created. You can now log in.');
      backToMenu();
    }
  </script>
</body>
</html>
