<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Coin — GameWorld</title>
<style>
  :root{--accent:#0f3460;--accentHover:#533483}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#fff;color:#222;min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid #eee;background:#fafafa;position:sticky;top:0;z-index:40}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--accent)}
  .console-icon{width:36px;height:36px;border-radius:8px;background:#e9eef9;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent)}
  nav{display:flex;gap:8px;align-items:center}
  button{background:var(--accent);color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}
  button.secondary{background:#fff;color:var(--accent);border:1px solid #ddd}
  .coin{margin-left:10px;font-weight:600}
  .container{max-width:900px;margin:24px auto;padding:18px}
  .box{border:1px solid #eee;padding:14px;border-radius:10px;background:#fafafa;margin-bottom:16px}
  input,select{width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;margin-bottom:8px}
  .vip-card{display:flex;gap:12px;align-items:center;margin-top:8px}
  .muted{color:#666}
  .admin-toggle{position:fixed;top:90px;right:28px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:none;align-items:center;justify-content:center}
  .panel{background:#fff;padding:18px;border-radius:10px;width:880px;max-height:80vh;overflow:auto}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}
</style>
</head>
<body>
<script>
  // helpers
  function getAccounts(){ return JSON.parse(localStorage.getItem('accounts')||'[]'); }
  function saveAccounts(a){ localStorage.setItem('accounts', JSON.stringify(a)); }
  function getCurrentUser(){ return localStorage.getItem('loggedInUser'); }
  function ensureUser(u){ if(!u) return null; const a=getAccounts(); const f=a.find(x=>x.username===u); if(f){ if(typeof f.coins!=='number') f.coins=Number(f.coins||0); if(!f.friends) f.friends=[]; if(!f.vip) f.vip=null; if(typeof f.banned === 'undefined') f.banned=false; return f;} return null;}
  function updateUserObj(user){ const a=getAccounts(); const i=a.findIndex(x=>x.username===user.username); if(i>=0){ a[i]=user; saveAccounts(a); } }
  function getRedeemCodes(){ return JSON.parse(localStorage.getItem('redeemCodes')||'{}'); }
  function saveRedeemCodes(obj){ localStorage.setItem('redeemCodes', JSON.stringify(obj)); }
  function addRedeemCode(code,val){ const c=getRedeemCodes(); c[code]=Number(val); saveRedeemCodes(c); }
  function removeRedeemCode(code){ const c=getRedeemCodes(); delete c[code]; saveRedeemCodes(c); }
  function getProducts(){ return JSON.parse(localStorage.getItem('products')||'[]'); }
  function saveProducts(p){ localStorage.setItem('products', JSON.stringify(p)); }
  function getPaints(){ return JSON.parse(localStorage.getItem('paintHistory')||'[]'); }
  function savePaints(p){ localStorage.setItem('paintHistory', JSON.stringify(p)); }
  function getGames(){ return JSON.parse(localStorage.getItem('games')||'[]'); }
  function saveGames(g){ localStorage.setItem('games', JSON.stringify(g)); }
  function uid(){ return 'id_'+Math.random().toString(36).slice(2,9); }

  // seed codes if missing (include your codes)
  (function seedCodes(){
    const c=getRedeemCodes();
    if(Object.keys(c).length===0){
      c['3D14U1Z'] = 50;
      c['41RUL5Y'] = 100;
      saveRedeemCodes(c);
    }
  })();
</script>

<header>
  <div class="brand"><div class="console-icon">▦</div><div>GameWorld — Coins</div></div>
  <nav>
    <div id="usernameDisplay">Welcome, Player</div>
    <div class="coin" id="coinDisplay">💰 Coins: 0</div>
    <button onclick="goHome()">Home</button>
    <button onclick="logout()">Logout</button>
  </nav>
</header>

<main class="container">
  <div class="box">
    <strong>Redeem Code</strong>
    <input id="redeemInput" placeholder="Enter code (e.g. 3D14U1Z)">
    <div style="display:flex;gap:8px">
      <button onclick="redeem()">Redeem</button>
      <button class="secondary" onclick="showCodes()">My Codes</button>
    </div>
    <div id="redeemMsg" class="muted" style="margin-top:8px"></div>
  </div>

  <div class="box">
    <strong>Send Coins to Another User</strong>
    <input id="sendTo" placeholder="Recipient username">
    <input id="sendAmt" type="number" placeholder="Amount">
    <div style="display:flex;gap:8px">
      <button onclick="sendCoins()">Send Coins</button>
      <button class="secondary" onclick="clearSend()">Clear</button>
    </div>
    <div id="sendMsg" class="muted" style="margin-top:8px"></div>
  </div>

  <div class="box">
    <strong>VIP Shop</strong>
    <div class="vip-card"><div style="flex:1"><div style="font-weight:700">VIP 1 Month</div><div class="muted">30 coins</div></div><div><button onclick="buyVIP('1M')">Buy</button></div></div>
    <div class="vip-card"><div style="flex:1"><div style="font-weight:700">VIP 6 Months</div><div class="muted">60 coins</div></div><div><button onclick="buyVIP('6M')">Buy</button></div></div>
    <div class="vip-card"><div style="flex:1"><div style="font-weight:700">VIP 1 Year</div><div class="muted">120 coins</div></div><div><button onclick="buyVIP('1Y')">Buy</button></div></div>
    <div class="vip-card"><div style="flex:1"><div style="font-weight:700">VIP Eternity</div><div class="muted">350 coins — toggleable</div></div><div><button onclick="buyVIP('ET')">Buy</button></div></div>
    <div id="vipMsg" class="muted" style="margin-top:8px"></div>
  </div>

  <!-- admin toggle for owners -->
  <div id="adminWrap" style="display:none;position:fixed;top:90px;right:28px">
    <button onclick="openAdmin()" style="background:#fff;border:1px solid #ddd;color:var(--accent)">⚙️ Admin Panel</button>
  </div>
</main>

<!-- Admin modal -->
<div class="modal" id="adminModal">
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h3 style="margin:0">Admin Panel</h3>
      <div><button onclick="closeAdmin()">Close</button></div>
    </div>

    <section style="margin-bottom:12px">
      <h4>Redeem Codes</h4>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <input id="newCode" placeholder="CODE (uppercase)">
        <input id="newCodeVal" type="number" placeholder="Value" style="width:120px">
        <button onclick="adminAddCode()">Add Code</button>
      </div>
      <div id="codesList" class="muted"></div>
    </section>

    <section>
      <h4>All Users</h4>
      <table id="usersTable">
        <thead><tr><th>Username</th><th>Coins</th><th>VIP</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </div>
</div>

<script>
  // main
  const current = getCurrentUser();
  if(!current) location.href='index.html';
  const owners = ['Airulmsyah','AMS','Ams09'];
  const isOwner = owners.includes(current);
  document.getElementById('usernameDisplay').textContent = `Welcome, ${current}`;
  document.getElementById('usernameDisplay').onclick = ()=> location.href='avatar.html';
  function goHome(){ location.href='home.html' }
  function logout(){ localStorage.removeItem('loggedInUser'); location.href='index.html' }

  // show admin toggle if owner
  if(isOwner) document.getElementById('adminWrap').style.display='block';

  // coin UI
  function refreshCoinUI(){
    const me = ensureUser(current);
    if(me) document.getElementById('coinDisplay').textContent = `💰 Coins: ${me.coins||0}`;
    window.refreshHomeHeader && window.refreshHomeHeader();
  }
  refreshCoinUI();

  // Redeem
  function redeem(){
    const code = (document.getElementById('redeemInput').value||'').trim().toUpperCase();
    const msg = document.getElementById('redeemMsg'); msg.textContent='';
    if(!code) return msg.textContent='Enter a code.';
    const codes = getRedeemCodes();
    if(!(code in codes)) return msg.textContent='Invalid or already used code.';
    const value = Number(codes[code]);
    const me = ensureUser(current);
    if(!me) return;
    me.coins = (me.coins||0) + value; updateUserObj(me);
    removeRedeemCode(code);
    msg.textContent = `Redeemed ${value} coins!`;
    refreshCoinUI();
  }

  // send coins
  function clearSend(){ document.getElementById('sendTo').value=''; document.getElementById('sendAmt').value=''; document.getElementById('sendMsg').textContent=''; }
  function sendCoins(){
    const to = (document.getElementById('sendTo').value||'').trim();
    const amt = Number(document.getElementById('sendAmt').value);
    const msg = document.getElementById('sendMsg'); msg.textContent='';
    if(!to || !amt || amt<=0) return msg.textContent='Enter valid recipient and amount.';
    const accounts = getAccounts();
    const target = accounts.find(a=>a.username===to);
    if(!target) return msg.textContent='Recipient not found.';
    const me = ensureUser(current);
    if((me.coins||0) < amt) return msg.textContent='Not enough coins.';
    me.coins = (me.coins||0) - amt; updateUserObj(me);
    target.coins = (target.coins||0) + amt; updateUserObj(target);
    msg.textContent = `Sent ${amt} coins to ${to}.`;
    refreshCoinUI();
  }

  // VIP buy (1M 30, 6M 60, 1Y 120, ET 350). Owners get ET free
  function buyVIP(type){
    const costs = {'1M':30,'6M':60,'1Y':120,'ET':350};
    const durMonths = {'1M':1,'6M':6,'1Y':12,'ET':0};
    const me = ensureUser(current);
    if(!me) return;
    if(type==='ET' && isOwner){
      // give free ET
      me.vip = { type:'ET', expires:null, active:true };
      updateUserObj(me);
      document.getElementById('vipMsg').textContent = 'Eternity VIP granted (owner).';
      refreshCoinUI(); return;
    }
    const cost = costs[type];
    if((me.coins||0) < cost) return document.getElementById('vipMsg').textContent = 'Not enough coins.';
    me.coins = (me.coins||0) - cost;
    if(type==='ET') me.vip = { type:'ET', expires:null, active:true };
    else {
      const now = new Date(); now.setMonth(now.getMonth() + durMonths[type]); me.vip = { type:type, expires: now.toISOString(), active:true };
    }
    updateUserObj(me);
    document.getElementById('vipMsg').textContent = 'VIP purchased.';
    refreshCoinUI();
  }

  // Admin functions
  function openAdmin(){ document.getElementById('adminModal').style.display='flex'; renderAdmin(); }
  function closeAdmin(){ document.getElementById('adminModal').style.display='none'; }
  function renderAdmin(){
    const codes = getRedeemCodes();
    const codesDiv = document.getElementById('codesList');
    codesDiv.innerHTML = Object.keys(codes).length ? Object.entries(codes).map(kv=>`<div>${kv[0]} — ${kv[1]} <button onclick="adminRemoveCode('${kv[0]}')">Delete</button></div>`).join('') : '<div class="muted">No redeem codes</div>';
    const accounts = getAccounts();
    const tbody = document.querySelector('#usersTable tbody'); tbody.innerHTML='';
    accounts.forEach(u=>{
      const tr = document.createElement('tr');
      const vipText = u.vip ? `${u.vip.type}${u.vip.active ? ' (active)' : ' (off)'}` : '-';
      const status = u.banned ? 'BANNED' : 'OK';
      tr.innerHTML = `<td>${u.username}</td><td>${Number(u.coins||0)}</td><td>${vipText}</td><td>${status}</td><td></td>`;
      const actionsTd = tr.querySelector('td:last-child');
      const addBtn = document.createElement('button'); addBtn.textContent='+Coins'; addBtn.onclick = ()=>{ const a=Number(prompt('Amount to add?')); if(a>0){ u.coins = (u.coins||0)+a; updateUserObj(u); renderAdmin(); refreshCoinUI(); } };
      actionsTd.appendChild(addBtn);
      const banBtn = document.createElement('button'); banBtn.style.marginLeft='6px'; banBtn.textContent = u.banned ? 'Unban' : 'Ban'; banBtn.onclick = ()=>{ u.banned = !u.banned; updateUserObj(u); renderAdmin(); };
      actionsTd.appendChild(banBtn);
      const rv = document.createElement('button'); rv.style.marginLeft='6px'; rv.textContent='Remove VIP'; rv.onclick = ()=>{ u.vip=null; updateUserObj(u); renderAdmin(); refreshCoinUI(); };
      actionsTd.appendChild(rv);
      const dg = document.createElement('button'); dg.style.marginLeft='6px'; dg.textContent='Delete Games'; dg.onclick = ()=>{ if(confirm('Delete games by '+u.username+'?')){ let games = getGames(); games = games.filter(g=>g.creator!==u.username); saveGames(games); alert('Deleted.'); renderAdmin(); } };
      actionsTd.appendChild(dg);
      tbody.appendChild(tr);
    });
  }

  function adminAddCode(){ const code=(document.getElementById('newCode').value||'').trim().toUpperCase(); const val=Number(document.getElementById('newCodeVal').value); if(!code||!val) return alert('Enter code and value'); addRedeemCode(code,val); document.getElementById('newCode').value=''; document.getElementById('newCodeVal').value=''; renderAdmin(); }
  function adminRemoveCode(c){ if(confirm('Remove code '+c+'?')){ removeRedeemCode(c); renderAdmin(); } }

  function showCodes(){ const c = getRedeemCodes(); alert('Available codes:\\n' + Object.entries(c).map(kv=>kv[0]+' → '+kv[1]).join('\\n')); }

  // init once
  (function init(){ refreshCoinUI(); })();
</script>
</body>
</html>
